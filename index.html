<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadView // Visualizador en la Nube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">LeadView</div>
        <nav>
            <button id="btn-ver-leads" class="nav-link active">Visualizador</button>
            <button id="btn-agregar-lead" class="nav-link">Agregar Cliente</button>
        </nav>
    </header>

    <main class="container">
        
        <section id="section-visualizador" class="content-section">
            <div class="section-header">
                <h2>Clientes Compartidos en la Nube</h2>
                <input type="text" id="search-bar" placeholder="Buscar por nombre, tipo o ubicación...">
            </div>
            
            <div id="leads-grid" class="leads-grid">
                <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Cargando clientes desde la nube...</p>
            </div>
        </section>

        <section id="section-formulario" class="content-section hidden">
            <h2>Cargar Nuevo Cliente Potencial</h2>
            <form id="lead-form">
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="lead-name">Nombre del Negocio *</label>
                        <input type="text" id="lead-name" required>
                    </div>
                    <div class="form-group">
                        <label for="lead-type">Tipo de Negocio *</label>
                        <input type="text" id="lead-type" placeholder="Ej. Restaurante, Taller, Estudio" required>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="lead-rating">Puntuación *</label>
                        <input type="number" id="lead-rating" min="0" max="5" step="0.1" placeholder="Ej. 4.5" required>
                    </div>
                    <div class="form-group">
                        <label for="lead-reviews">Cantidad de Reseñas *</label>
                        <input type="number" id="lead-reviews" min="0" placeholder="Ej. 120" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="lead-address">Dirección Física *</label>
                    <input type="text" id="lead-address" placeholder="Ej. Av. Principal #123" required>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="lead-location">Ubicación (Ciudad / Zona) *</label>
                        <input type="text" id="lead-location" placeholder="Ej. Bogotá / Chapinero" required>
                    </div>
                    <div class="form-group">
                        <label for="lead-maps">Enlace de Google Maps *</label>
                        <input type="url" id="lead-maps" placeholder="https://maps.app.goo.gl/..." required>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="lead-phone">Número de Contacto</label>
                        <input type="tel" id="lead-phone" placeholder="Ej. +573001234567">
                    </div>
                    <div class="form-group">
                        <label for="lead-email">Correo Electrónico (Opcional)</label>
                        <input type="email" id="lead-email" placeholder="Ej. contacto@negocio.com">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-save">Guardar Cliente en la Nube</button>
            </form>
        </section>

    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
